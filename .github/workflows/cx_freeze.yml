# This is a basic workflow to help you get started with Actions

name: Cx_Freeze

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Build binaries on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 单个平台失败不影响其它平台继续构建
      fail-fast: false
      matrix:
        # macos-13 已下线（runner 不再提供，job 会一直排队）。
        # 这里必须用 macos-15-intel（x64）：macos-15 是 arm64，而 slimeface 只提供
        # cp310 的 macosx x86_64 轮子，arm64 上会退回源码编译并因缺少
        # libfacedetection 子模块失败。
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'poetry'

      - name: Setup dynamic versioning
        run: poetry self add poetry-dynamic-versioning

      - name: Install dependencies
        run: |
          poetry install

      - name: Build with Cx_Freeze
        run: poetry run python setup.py build_exe -b dist

      - name: Set VERSION variable for windows
        shell: bash
        run: |
          echo "VERSION=`poetry run python tools/version.py`" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: JavSP-${{ env.VERSION }}-${{ matrix.os }}
          path: dist
